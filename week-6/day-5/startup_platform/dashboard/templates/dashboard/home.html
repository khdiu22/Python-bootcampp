<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        .navbar {
            background-color: #333;
            overflow: hidden;
            display: flex;
            padding: 10px 20px;
        }
        .navbar a {
            color: white;

            padding: 12px 20px;
            display: block;

            border-radius: 4px;
        }

            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="{% url 'dashboard:reports' %}">Reports</a>
        <a href="{% url 'users:login' %}">Users</a>
        <a href="{% url 'courses:list' %}">Courses</a>
        <a href="{% url 'payments:checkout' %}">Payments</a>
    </div>

    <div class="content">
        <h1>Dashboard Home</h1>
    </div>

</body>
</html>
